schema_version: 1
component:
  id: personal
  name: Dk Personal
  layer: KERNEL
  artifact_type: architecture
  problem: "Without continuous representation owned by the person, identity, memory and agency remain fragmented across and dependent on platforms."
  scope:
    - "Public description of one continuous personal representation per member, bound to UID and personal Dknowledge."
    - "Public description of personal context that does not travel."
    - "Public description of carrying identity, knowledge, decisions, commitments and direction across replaceable models and interfaces."
    - "Public description of learning contributed upward."
    - "Public description of relation to Dknowledge, Dk Local and Dk Global."
  non_scope:
    - "A released assistant, agent or application."
    - "Any handling of real personal data."
    - "The operational runtime, and the global scale of Dk."
  dependencies:
    - dk
    - uid
    - lc
  implementation:
    level: none
    scope: This repository publishes a charter and open questions; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/dk-personal/issues
  source_of_truth:
    repository: https://github.com/draykerdk/dk-personal
    path: README.md
  last_reviewed: "2026-08-11"
