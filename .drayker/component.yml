schema_version: 1
component:
  id: personal
  name: Dk Personal
  layer: KERNEL
  artifact_type: architecture
  problem: "An assistant that belongs to a platform ultimately works for the platform; an assistant must act strictly on the side of the person."
  scope:
    - "Public description of one agent per member, bound to UID."
    - "Public description of distributed topology: runs locally on user hardware and nearest edge nodes."
    - "Public description of offline capability: operates offline under specific conditions and with reduced capacity."
    - "Public description of partner role: acts on the person's side as partner, assistant, trainer and tutor."
    - "Public description of personal context that does not travel, zero continuous telemetry, and protection of intimate contradiction."
    - "Public description of organizing knowledge, decisions and tasks for one person."
    - "Public description of anonymous federated learning through patterns with depersonalized metadata while raw context stays local."
    - "Public separation between federated patterns and deliberate, authorized sharing of knowledge."
    - "Public description of consent, refusal, contestability and portability."
    - "Public description of relation to Dknowledge, Dk Local and Dk Global."
  non_scope:
    - "A released assistant, agent or application today."
    - "External behavioral surveillance, performance scoring, or acting as a boss/monitor."
    - "Any handling of real personal data on central servers."
    - "The operational runtime, and the global scale of Dk."
  dependencies:
    - dk
    - uid
    - lc
  implementation:
    level: none
    scope: This repository publishes a charter and open questions; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
    - Depersonalized metadata may still permit re-identification unless safeguards are tested.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/dk-personal/issues
  source_of_truth:
    repository: https://github.com/draykerdk/dk-personal
    path: README.md
  last_reviewed: "2026-09-03"
