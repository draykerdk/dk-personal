title: "Dk Personal"
description: "The continuous representation that belongs to one member. Each member’s own intelligence, bound to their identity and personal Dknowledge, carrying memory, decisions, commitments and direction across replaceable models and interfaces."
remote_theme: draykerdk/drayker-theme
url: "https://personal.drayker.org"
dk_kicker: "Kernel scope"
dk_subdomain: "personal.drayker.org"
dk_repo: "https://github.com/draykerdk/dk-personal"


# jekyll-remote-theme fetches the shared layout; jekyll-optional-front-matter lets
# README.md render without front matter; the defaults block is what actually applies
# the layout to it. Without all three, GitHub Pages serves bare converted markdown.
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#FFB3A0"  # the one that is yours: skin-warm, closest to human
